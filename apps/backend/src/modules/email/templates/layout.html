<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{preheader}}</title>
  </head>
  <body style="margin:0; padding:0; width:100%; background:#f3f4f6; color:#111827; font-family:Arial, Helvetica, sans-serif; -webkit-text-size-adjust:100%;">
    <div style="display:none; max-height:0; max-width:0; overflow:hidden; opacity:0; color:transparent;">{{preheader}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f4f6" style="width:100%; background:#f3f4f6;">
      <tr>
        <td align="center" style="padding:28px 12px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; border:1px solid #e5e7eb; border-radius:16px; background:#ffffff; overflow:hidden;">
            <tr>
              <td style="padding:22px 28px; border-bottom:1px solid #e5e7eb; background:#ffffff;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td valign="middle" style="width:42px;">
                      <div style="width:36px; height:36px; border-radius:12px; background:#16a34a; color:#f4efe6; font-size:20px; font-weight:700; line-height:36px; text-align:center;">&hearts;</div>
                    </td>
                    <td valign="middle" style="padding-left:12px;">
                      <p style="margin:0 0 3px; color:#9ca3af; font-size:10px; font-weight:800; letter-spacing:1.6px; line-height:1.2; text-transform:uppercase;">Operacao comunitaria</p>
                      <p style="margin:0; color:#111827; font-size:17px; font-weight:700; letter-spacing:-.2px; line-height:1.2;">Rede Solidaria</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 28px 30px; background:#ffffff;">{{content}}</td>
            </tr>
            <tr>
              <td style="padding:20px 28px 24px; border-top:1px solid #f3f4f6; background:#f9fafb; text-align:center;">
                <p style="margin:0 0 5px; color:#4b5563; font-size:12px; font-weight:700;">Rede Solidaria</p>
                <p style="margin:0; color:#9ca3af; font-size:11px; line-height:1.5;">Mensagem automatica. Por favor, nao responda diretamente a este e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
