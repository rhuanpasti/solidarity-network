<div class="workspace">
  <app-page-header
    eyebrow="features.beneficiaries.eyebrow"
    title="features.beneficiaries.title"
    description="features.beneficiaries.description"
  />

  <app-beneficiary-filters
    [form]="beneficiariesState.filterForm"
    [programOptions]="programOptions()"
    [pageSizes]="beneficiariesState.pageSizes"
    (submitFilters)="beneficiariesState.applyFilters()"
    (pageSizeChange)="beneficiariesState.changePageSize($event)"
  />

  <div class="content-grid">
    <app-beneficiary-list
      [items]="beneficiariesState.items()"
      [pagination]="beneficiariesState.pagination()"
      [listLoading]="beneficiariesState.listLoading()"
      [submitPending]="beneficiariesState.submitPending()"
      (create)="beneficiariesState.editor.startCreate()"
      (select)="beneficiariesState.editor.select($event)"
      (pageChange)="beneficiariesState.changePage($event)"
    />

    <app-beneficiary-form
      [form]="beneficiariesState.form"
      [selected]="beneficiariesState.selected()"
      [generatedCredential]="beneficiariesState.generatedCredential()"
      [isReadOnly]="beneficiariesState.isReadOnly()"
      [submitPending]="beneficiariesState.submitPending()"
      [programOptions]="programOptions()"
      [countryOptions]="countryOptions()"
      [documentLabelKey]="beneficiariesState.documentLabelKey()"
      [addressLookupMessageKey]="beneficiariesState.addressLookupMessageKey()"
      (save)="beneficiariesState.submit()"
      (cancel)="beneficiariesState.editor.cancel()"
      (edit)="beneficiariesState.editor.startEditing()"
      (postalCodeBlur)="beneficiariesState.lookupAddressByPostalCode()"
    />
  </div>
</div>
