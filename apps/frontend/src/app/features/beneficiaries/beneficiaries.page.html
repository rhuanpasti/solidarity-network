<div class="workspace">
  <app-page-header
    eyebrow="features.beneficiaries.eyebrow"
    title="features.beneficiaries.title"
    description="features.beneficiaries.description"
    [showRefresh]="true"
    [refreshing]="refreshing()"
    [refreshDisabled]="refreshDisabled()"
    [refreshCooldownSeconds]="refreshCooldownSeconds()"
    (refresh)="refresh()"
  />

  <ng-template #editorDialog>
    <app-modal
      [title]="beneficiariesState.selected() ? 'features.beneficiaries.editTitle' : 'features.beneficiaries.createTitle'"
      description="features.beneficiaries.formDescription"
      [showReadonlyNote]="beneficiariesState.isReadOnly()"
      (closed)="closeEditorDialog()"
    >
      @if (beneficiariesState.selected() && beneficiariesState.isReadOnly()) {
        <app-button modalAction type="button" variant="ghost" [disabled]="beneficiariesState.submitPending()" (click)="beneficiariesState.editor.startEditing()">
          <span class="material-symbols-rounded" aria-hidden="true">edit</span>
          {{ 'common.edit' | translate }}
        </app-button>
      }

      <app-beneficiary-form
        [form]="beneficiariesState.form"
        [selected]="beneficiariesState.selected()"
        [generatedCredential]="beneficiariesState.generatedCredential()"
        [isReadOnly]="beneficiariesState.isReadOnly()"
        [submitPending]="beneficiariesState.submitPending()"
        [programOptions]="activeProgramOptions()"
        [dependentRelationshipOptions]="beneficiariesState.dependentRelationshipOptions"
        [countryOptions]="countryOptions()"
        [documentLabelKey]="beneficiariesState.documentLabelKey"
        [addressLookupMessageKey]="beneficiariesState.addressLookupMessageKey()"
        (saveRequested)="submitBeneficiary()"
        (cancelRequested)="cancelEditor()"
        (addDependent)="beneficiariesState.addDependent()"
        (removeDependent)="beneficiariesState.removeDependent($event)"
        (postalCodeBlur)="beneficiariesState.lookupAddressByPostalCode()"
      />
    </app-modal>
  </ng-template>

  <app-beneficiary-filters
    [form]="beneficiariesState.filterForm"
    [programOptions]="programOptions()"
    (submitFilters)="beneficiariesState.applyFilters()"
  />

  <div class="content-grid listing-grid">
    <app-beneficiary-list
      [items]="beneficiariesState.items()"
      [pagination]="beneficiariesState.pagination()"
      [pageSize]="beneficiariesState.filters().pageSize"
      [pageSizes]="beneficiariesState.pageSizes"
      [listLoading]="beneficiariesState.listLoading()"
      [submitPending]="beneficiariesState.submitPending()"
      (create)="openCreate(editorDialog)"
      (itemSelected)="openItem($event, editorDialog)"
      (pageChange)="beneficiariesState.changePage($event)"
      (pageSizeChange)="beneficiariesState.changePageSize($event)"
    />

  </div>
</div>
