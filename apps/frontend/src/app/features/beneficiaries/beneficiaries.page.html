<div class="workspace">
  <app-page-header
    eyebrow="features.beneficiaries.eyebrow"
    title="features.beneficiaries.title"
    description="features.beneficiaries.description"
  />

  <app-beneficiary-filters
    [form]="state.filterForm"
    [programOptions]="programOptions()"
    [pageSizes]="state.pageSizes"
    (submitFilters)="state.applyFilters()"
    (pageSizeChange)="state.changePageSize($event)"
  />

  <div class="content-grid">
    <app-beneficiary-list
      [items]="state.items()"
      [pagination]="state.pagination()"
      [listLoading]="state.listLoading()"
      [submitPending]="state.submitPending()"
      (create)="state.editor.startCreate()"
      (select)="state.editor.select($event)"
      (pageChange)="state.changePage($event)"
    />

    <app-beneficiary-form
      [form]="state.form"
      [selected]="state.selected()"
      [generatedCredential]="state.generatedCredential()"
      [isReadOnly]="state.isReadOnly()"
      [submitPending]="state.submitPending()"
      [programOptions]="programOptions()"
      [countryOptions]="countryOptions()"
      [documentLabelKey]="state.documentLabelKey()"
      [addressLookupMessageKey]="state.addressLookupMessageKey()"
      (save)="state.submit()"
      (cancel)="state.editor.cancel()"
      (edit)="state.editor.startEditing()"
      (postalCodeBlur)="state.lookupAddressByPostalCode()"
    />
  </div>
</div>
