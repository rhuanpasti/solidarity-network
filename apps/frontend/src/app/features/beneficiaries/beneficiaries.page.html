<div class="workspace">
  <app-page-header
    eyebrow="features.beneficiaries.eyebrow"
    title="features.beneficiaries.title"
    description="features.beneficiaries.description"
  />

  <app-beneficiary-filters
    [form]="vm.filterForm"
    [programOptions]="programOptions()"
    [pageSizes]="vm.pageSizes"
    (submitFilters)="vm.applyFilters()"
    (pageSizeChange)="vm.changePageSize($event)"
  />

  <div class="content-grid">
    <app-beneficiary-list
      [items]="vm.items()"
      [pagination]="vm.pagination()"
      [listLoading]="vm.listLoading()"
      [submitPending]="vm.submitPending()"
      (create)="vm.editor.startCreate()"
      (select)="vm.editor.select($event)"
      (pageChange)="vm.changePage($event)"
    />

    <app-beneficiary-form
      [form]="vm.form"
      [selected]="vm.selected()"
      [generatedCredential]="vm.generatedCredential()"
      [isReadOnly]="vm.isReadOnly()"
      [submitPending]="vm.submitPending()"
      [programOptions]="programOptions()"
      [countryOptions]="countryOptions()"
      [documentLabelKey]="vm.documentLabelKey()"
      [addressLookupMessageKey]="vm.addressLookupMessageKey()"
      (save)="vm.submit()"
      (cancel)="vm.editor.cancel()"
      (edit)="vm.editor.startEditing()"
      (postalCodeBlur)="vm.lookupAddressByPostalCode()"
    />
  </div>
</div>
