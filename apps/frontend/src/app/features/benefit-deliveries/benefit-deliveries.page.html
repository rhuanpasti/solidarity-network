<div class="workspace">
  <app-page-header
    eyebrow="features.benefitDeliveries.eyebrow"
    [title]="'features.benefitDeliveries.title' | translate"
    description="features.benefitDeliveries.description"
    [showRefresh]="true"
    [refreshing]="refreshing()"
    [refreshDisabled]="refreshDisabled()"
    [refreshCooldownSeconds]="refreshCooldownSeconds()"
    (refresh)="refresh()"
  />

  <ng-template #editorDialog>
    <app-modal
      [title]="editorTitle() | translate"
      [description]="editorDescription() | translate"
      (closed)="closeEditorDialog()"
    >
      @if (selectedDelivery()) {
        <app-detail-grid [items]="selectedDeliveryDetails()" />
      } @else {
        <form class="form" [formGroup]="form" (ngSubmit)="submit()">
          <div class="field-grid">
            <app-form-select
              [control]="form.controls.charityProgramId"
              label="forms.charityProgram"
              [options]="programOptions()"
              [searchable]="true"
              [errors]="[['required', 'validation.required']]"
              placeholder="common.selectOption"
            />

            <app-form-select
              [control]="form.controls.beneficiaryId"
              label="forms.beneficiary"
              [options]="formBeneficiaryOptions()"
              [errors]="[['required', 'validation.required']]"
              placeholder="common.selectOption"
            />
          </div>

          <app-form-select
            [control]="form.controls.benefitId"
            label="forms.benefit"
            [options]="benefitOptions()"
            [errors]="[['required', 'validation.required']]"
            placeholder="common.selectOption"
          />

          <div class="field-grid">
            <app-input-field
              [control]="form.controls.quantity"
              label="forms.quantity"
              type="number"
              [min]="1"
              [errors]="[
                ['required', 'validation.required'],
                ['min', 'validation.minValue']
              ]"
            />

            <app-input-field
              [control]="form.controls.deliveryDate"
              label="forms.deliveryDate"
              type="date"
              [errors]="[['required', 'validation.required']]"
            />
          </div>

          <app-input-field
            [control]="form.controls.reference"
            label="forms.reference"
            [errors]="[
              ['required', 'validation.required'],
              ['maxlength', 'validation.maxLength']
            ]"
          />

          <app-input-field
            [control]="form.controls.notes"
            label="forms.notes"
            [textarea]="true"
          />

          <div class="actions">
            <app-button type="submit" variant="primary" [loading]="submitPending()">
              {{ 'common.registerDelivery' | translate }}
            </app-button>
          </div>
        </form>
      }
    </app-modal>
  </ng-template>

  <form class="panel filter-panel" [formGroup]="filterForm" (ngSubmit)="applyFilters()">
    <div class="filter-grid">
      <app-form-select
        [control]="filterForm.controls.beneficiaryId"
        label="forms.beneficiary"
        [options]="filterBeneficiaryOptions()"
        placeholder="common.all"
      />

      <app-form-select
        [control]="filterForm.controls.charityProgramId"
        label="forms.charityProgram"
        [options]="programOptions()"
        [searchable]="true"
        placeholder="common.all"
      />

    </div>

    <div class="actions">
      <app-button type="submit" variant="secondary">
        {{ 'common.applyFilters' | translate }}
      </app-button>
    </div>
  </form>

  <div class="content-grid listing-grid">
    <app-list-panel
      [title]="'features.benefitDeliveries.historyTitle' | translate"
      description="features.benefitDeliveries.historyDescription"
      emptyTitle="features.benefitDeliveries.emptyTitle"
      emptyDescription="features.benefitDeliveries.emptyDescription"
      [hasItems]="deliveries().length > 0"
      [loading]="listLoading()"
      [pagination]="pagination()"
      [pageSize]="filters().pageSize"
      [pageSizes]="pageSizes"
      (pageChange)="changePage($event)"
      (pageSizeChange)="changePageSize($event)"
    >
      <app-button panelAction type="button" variant="secondary" [disabled]="submitPending()" (click)="openCreate(editorDialog)">
        {{ 'common.add' | translate }}
      </app-button>

      <div panelList class="list">
        @for (delivery of deliveries(); track delivery.id) {
          <button type="button" class="list-item" (click)="openDelivery(delivery, editorDialog)">
            <div>
              <strong>{{ delivery.beneficiary.fullName }}</strong>
              <p>{{ delivery.benefit.name }} · {{ delivery.charityProgram.name }}</p>
              <small>{{ delivery.administrator.name }}</small>
            </div>
            <div class="item-meta">
              <span>x{{ delivery.quantity }}</span>
              <small>{{ delivery.deliveryDate | date: 'mediumDate' }}</small>
              <small>#{{ delivery.reference }}</small>
            </div>
          </button>
        }
      </div>
    </app-list-panel>

  </div>
</div>
