services:
  postgres:
    image: postgres:16-alpine
    container_name: solidarity-network-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solidarity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      - postgres
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/solidarity?schema=public
      CORS_ORIGIN: http://localhost:4200
      JWT_SECRET: change-me
    ports:
      - '3000:3000'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - '4200:80'

volumes:
  postgres_data:
